<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #6197e8;
            font-family: Georgia, serif;
        }

        .container {
            width: 400px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: white;
            padding: 60px 50px;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 10px 15px;
            margin-bottom: 22px;
            box-sizing: border-box;
            border: none;
            background-color: #f1f1f1;
            font-size: 15px;
        }

        input::placeholder {
            color: #777;
        }

        button {
            width: 100%;
            height: 45px;
            background-color: #6197e8;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #407bd5;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #f1f1f1;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <form action="/predict" method="POST">

            <label for="bedrooms">Bedrooms:</label>

            <input
                type="number"
                id="bedrooms"
                name="bedrooms"
                placeholder="Enter the no of Bedrooms"
                step="any"
                required
            >


            <label for="bathrooms">Bathrooms:</label>

            <input
                type="number"
                id="bathrooms"
                name="bathrooms"
                placeholder="Enter the no of Bathrooms"
                step="any"
                required
            >


            <label for="floors">Floors:</label>

            <input
                type="number"
                id="floors"
                name="floors"
                placeholder="Enter the no of Floors"
                step="any"
                required
            >


            <label for="yr_built">Year Built:</label>

            <input
                type="number"
                id="yr_built"
                name="yr_built"
                placeholder="Enter the Year Built"
                required
            >


            <button type="submit">
                Predict Price
            </button>

        </form>


        {% if data is defined %}
        <div class="result">
            Predicted House Price: {{ data }}
        </div>
        {% endif %}

    </div>

</body>

</html>
